<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <defs>
    <radialGradient id="g2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>
  <ellipse cx="180" cy="140" rx="160" ry="125" fill="url(#g2)"/>
  <!-- Perfume bottle -->
  <g filter="url(#shadow2)" transform="translate(110, 20)">
    <rect x="45" y="55" width="50" height="80" rx="10" fill="white" opacity="0.95"/>
    <rect x="55" y="40" width="30" height="20" rx="5" fill="white" opacity="0.9"/>
    <rect x="65" y="30" width="10" height="16" rx="3" fill="#c2e9fb" opacity="0.8"/>
    <!-- Label -->
    <rect x="50" y="75" width="40" height="45" rx="4" fill="#f093fb" opacity="0.3"/>
    <text x="70" y="95" text-anchor="middle" font-size="9" font-weight="700" fill="#764ba2" font-family="Arial,sans-serif">LUXE</text>
    <text x="70" y="108" text-anchor="middle" font-size="7" fill="#764ba2" font-family="Arial,sans-serif">PARFUM</text>
  </g>
  <!-- Sparkles -->
  <text x="55" y="80" font-size="22">✨</text>
  <text x="255" y="70" font-size="18">💫</text>
  <text x="240" y="180" font-size="16">⭐</text>
  <!-- New badge -->
  <g transform="translate(220, 90)">
    <rect x="0" y="0" width="80" height="36" rx="18" fill="white" opacity="0.9"/>
    <text x="40" y="24" text-anchor="middle" font-size="16" font-weight="900" fill="#f5576c" font-family="Arial,sans-serif">✦ NEW</text>
  </g>
  <text x="180" y="240" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.85)" font-family="Arial,sans-serif">Koleksi terbaru sudah hadir!</text>
</svg>
