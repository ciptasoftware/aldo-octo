<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <defs>
    <radialGradient id="g3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>
  <ellipse cx="180" cy="140" rx="160" ry="125" fill="url(#g3)"/>
  <!-- Delivery truck -->
  <g filter="url(#shadow3)" transform="translate(60, 60)">
    <!-- Truck body -->
    <rect x="40" y="40" width="140" height="80" rx="8" fill="white" opacity="0.95"/>
    <!-- Cab -->
    <rect x="145" y="55" width="60" height="65" rx="8" fill="white" opacity="0.9"/>
    <!-- Window -->
    <rect x="152" y="62" width="40" height="28" rx="4" fill="#4facfe" opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="85" cy="126" r="18" fill="#1a1a2e" opacity="0.85"/>
    <circle cx="85" cy="126" r="10" fill="#4facfe"/>
    <circle cx="168" cy="126" r="18" fill="#1a1a2e" opacity="0.85"/>
    <circle cx="168" cy="126" r="10" fill="#4facfe"/>
    <!-- Stripes on truck -->
    <rect x="48" y="55" width="90" height="8" rx="4" fill="#4facfe" opacity="0.4"/>
    <!-- FREE label -->
    <text x="92" y="90" text-anchor="middle" font-size="14" font-weight="900" fill="#00b0ff" font-family="Arial,sans-serif">GRATIS</text>
    <text x="92" y="108" text-anchor="middle" font-size="11" fill="#555" font-family="Arial,sans-serif">ONGKIR</text>
  </g>
  <!-- Package box -->
  <g transform="translate(258, 80)">
    <rect x="0" y="0" width="46" height="42" rx="5" fill="white" opacity="0.9"/>
    <line x1="23" y1="0" x2="23" y2="42" stroke="#4facfe" stroke-width="2"/>
    <line x1="0" y1="20" x2="46" y2="20" stroke="#4facfe" stroke-width="2"/>
    <text x="23" y="54" text-anchor="middle" font-size="18">📦</text>
  </g>
  <!-- Motion lines -->
  <line x1="30" y1="105" x2="60" y2="105" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="120" x2="58" y2="120" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="28" y1="135" x2="55" y2="135" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <text x="180" y="240" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.85)" font-family="Arial,sans-serif">Dikirim ke seluruh Indonesia 🇮🇩</text>
</svg>
