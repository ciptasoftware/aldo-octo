{{ define "admin_brand_modal" }}
<div class="modal-overlay active" id="modalBrandForm">
    <div class="modal-card">
        <div class="modal-header">
            <h3>{{ if .Brand.ID }}Edit Brand: {{ .Brand.Name }}{{ else }}Buat Brand Baru{{ end }}</h3>
            <button type="button" class="btn-close" onclick="closeAdminModal('modalBrandForm')">&times;</button>
        </div>
        <form enctype="multipart/form-data" onsubmit="submitAdminForm(event, '/admin/brands', 'containerBrands', 'modalBrandForm')">
            <input type="hidden" name="id" value="{{ .Brand.ID }}">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nama Brand <span style="color:red;">*</span></label>
                    <input type="text" class="form-control" name="name" id="fBrandName" value="{{ .Brand.Name }}" placeholder="Masukkan nama brand" required
                           oninput="if(!document.getElementById('fBrandSlug').dataset.userEdited){ document.getElementById('fBrandSlug').value = this.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, ''); }">
                </div>
                <div class="form-group">
                    <label class="form-label">Slug (Identitas URL) <span style="color:red;">*</span></label>
                    <input type="text" class="form-control" name="slug" id="fBrandSlug" value="{{ .Brand.Slug }}" placeholder="contoh: nike" required
                           oninput="this.dataset.userEdited = true;">
                </div>
                <div class="form-group">
                    <label class="form-label">Upload File Logo (JPG/PNG, Maks. 2MB)</label>
                    <input type="file" class="form-control" name="logo_file" accept="image/jpeg,image/png"
                           onchange="if(this.files[0] && this.files[0].size > 2*1024*1024){ alert('Ukuran file maksimal 2MB!'); this.value=''; }">
                    <small style="display:block; color:#64748b; margin-top:0.25rem;">File disimpan di folder <code>/asset/brands/</code></small>
                </div>
                <div class="form-group">
                    <label class="form-label">Atau Logo URL {{ if not .Brand.ID }} (Opsional jika upload file) {{ end }}</label>
                    <input type="text" class="form-control" name="logo_url" value="{{ .Brand.LogoURL }}" placeholder="/asset/brands/logo.png atau https://domain.com/logo.png">
                </div>
                <div class="form-group">
                    <label class="form-label">Deskripsi <span style="color:red;">*</span></label>
                    <textarea class="form-control" name="description" rows="3" placeholder="Deskripsi singkat brand..." required>{{ .Brand.Description }}</textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeAdminModal('modalBrandForm')">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan Brand</button>
            </div>
        </form>
    </div>
</div>
{{ end }}
