{{ define "admin_partner_modal" }}
<div class="modal-overlay active" id="modalPartnerForm">
    <div class="modal-card">
        <div class="modal-header">
            <h3>{{ if .Partner }}Edit Data Partner{{ else }}Tambah Partner Baru{{ end }}</h3>
            <button class="btn-close" onclick="closeAdminModal('modalPartnerForm')">&times;</button>
        </div>
        <form onsubmit="submitAdminForm(event, '/admin/partners', 'containerPartners', 'modalPartnerForm')">
            <div class="modal-body">
                <input type="hidden" name="id" value="{{ if .Partner }}{{ .Partner.ID }}{{ else }}0{{ end }}">
                
                <div class="form-group">
                    <label class="form-label">Nama Lengkap <span style="color:red;">*</span></label>
                    <input type="text" name="name" class="form-control" placeholder="Contoh: Budi Santoso" value="{{ if .Partner }}{{ .Partner.Name }}{{ end }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Alamat Email <span style="color:red;">*</span></label>
                    <input type="email" name="email" class="form-control" placeholder="partner@perusahaan.com" value="{{ if .Partner }}{{ .Partner.Email }}{{ end }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">No. Telepon / WhatsApp</label>
                    <input type="text" name="phone" class="form-control" placeholder="081234567890" value="{{ if .Partner }}{{ .Partner.Phone }}{{ end }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Nama Perusahaan / Institusi</label>
                    <input type="text" name="company_name" class="form-control" placeholder="PT Solusi Digital" value="{{ if .Partner }}{{ .Partner.CompanyName }}{{ end }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Deskripsi / Catatan Partner</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Keterangan singkat mitra bisnis...">{{ if .Partner }}{{ .Partner.Description }}{{ end }}</textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Kata Sandi / Password {{ if .Partner }}<small style="color:var(--text-muted); font-weight:normal;">(Kosongkan jika tidak diubah)</small>{{ else }}<span style="color:red;">*</span>{{ end }}</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" {{ if not .Partner }}required{{ end }}>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeAdminModal('modalPartnerForm')">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan Data Partner</button>
            </div>
        </form>
    </div>
</div>
{{ end }}
