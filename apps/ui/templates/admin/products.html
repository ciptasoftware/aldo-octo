{{ define "admin_products" }}
<div class="page-header">
    <div>
        <h1 class="page-title">Master Data Produk</h1>
        <p style="color:var(--text-muted); margin-top:0.25rem;">Kelola seluruh inventaris produk toko e-commerce.</p>
    </div>
    <button class="btn btn-primary" onclick="openAdminModal('/admin/products/modal')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Tambah Produk
    </button>
</div>

<div class="table-container" id="containerProducts">
    {{ template "admin_product_table" . }}
</div>
{{ end }}
