{{ define "admin_project_managers" }}
<div class="page-header">

        <p style="color:var(--text-muted); margin-top:0.25rem;">Kelola daftar Project Manager dan manajer proyek terdaftar.</p>
    </div>
    <button class="btn btn-primary" onclick="openAdminModal('/admin/project-managers/modal')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Tambah Project Manager
    </button>
</div>

<div class="table-container" id="containerProjectManagers">
    {{ template "admin_project_manager_table" . }}
</div>
{{ end }}
