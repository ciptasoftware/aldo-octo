{{ define "store_login" }}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registrasi Mitra & PM — Aldo Solution Store</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/store.css?v=1.4">
    <style>
        .auth-section {
            padding: 4rem 0;
            background: #f8fafc;
            min-height: 70vh;
            display: flex;
            align-items: center;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 2.5rem;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 1.75rem;
        }
        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #64748b;
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .auth-tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }
        .form-group-cust {
            margin-bottom: 1.25rem;
        }
        .form-label-cust {
            display: block;
            font-size: 0.84rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.4rem;
        }
        .form-input-cust {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.875rem;
            outline: none;
            box-sizing: border-box;
        }
        .form-input-cust:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .btn-auth-submit {
            width: 100%;
            padding: 0.8rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-auth-submit:hover {
            background: #1d4ed8;
        }
        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>

    <!-- Main Header -->
    <header class="header-main">
        <div class="container header-inner">
            <a href="/" class="brand-logo">
                <span class="brand-name">Aldo<span class="brand-accent">Solution</span></span>
            </a>
            <div>
                <a href="/" style="color:#2563eb; text-decoration:none; font-weight:600;">&larr; Kembali ke Beranda</a>
            </div>
        </div>
    </header>

    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" id="tabBtnLogin" onclick="switchAuthTab('login')">Masuk (Login)</button>
                    <button type="button" class="auth-tab" id="tabBtnRegister" onclick="switchAuthTab('register')">Pendaftaran Akun Baru</button>
                </div>

                {{ if .Error }}
                    <div class="alert-error">⚠️ {{ .Error }}</div>
                {{ end }}

                <!-- LOGIN FORM -->
                <form id="formLogin" action="/login" method="POST">
                    <input type="hidden" name="redirect" value="{{ .Redirect }}">
                    
                    <div class="form-group-cust">
                        <label class="form-label-cust">Tipe Akun Pengguna <span style="color:red;">*</span></label>
                        <select name="user_type" class="form-input-cust" required>
                            <option value="partner">Mitra Resmi</option>
                            <option value="project_manager">Project Manager</option>
                        </select>
                    </div>

                    <div class="form-group-cust">
                        <label class="form-label-cust">Alamat Email Terdaftar <span style="color:red;">*</span></label>
                        <input type="email" name="email" class="form-input-cust" placeholder="nama@perusahaan.com" required>
                    </div>

                    <div class="form-group-cust">
                        <label class="form-label-cust">Kata Sandi (Password) <span style="color:red;">*</span></label>
                        <input type="password" name="password" class="form-input-cust" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-auth-submit">🔑 Masuk Sesi Akun</button>
                </form>

                <!-- REGISTER FORM -->
                <form id="formRegister" action="/register" method="POST" style="display:none;">
                    <input type="hidden" name="redirect" value="{{ .Redirect }}">

                    <div class="form-group-cust">
                        <label class="form-label-cust">Pilih Tipe Peran Akun Baru <span style="color:red;">*</span></label>
                        <select name="user_type" class="form-input-cust" required>
                            <option value="partner">Mitra Resmi</option>
                            <option value="project_manager">Project Manager</option>
                        </select>
                        <small style="color:#64748b; font-size:0.75rem; display:block; margin-top:0.25rem;">
                            *) 1 email hanya boleh terdaftar pada 1 tipe akun saja.
                        </small>
                    </div>

                    <div class="form-group-cust">
                        <label class="form-label-cust">Nama Lengkap <span style="color:red;">*</span></label>
                        <input type="text" name="name" class="form-input-cust" placeholder="Nama Lengkap Anda" required>
                    </div>

                    <div class="form-group-cust">
                        <label class="form-label-cust">Alamat Email Unik <span style="color:red;">*</span></label>
                        <input type="email" name="email" class="form-input-cust" placeholder="nama@perusahaan.com" required>
                    </div>

                    <div class="form-group-cust">
                        <label class="form-label-cust">Nomor Telepon / WhatsApp</label>
                        <input type="text" name="phone" class="form-input-cust" placeholder="08123456789">
                    </div>

                    <div class="form-group-cust">
                        <label class="form-label-cust">Nama Perusahaan / Instansi</label>
                        <input type="text" name="company_name" class="form-input-cust" placeholder="PT Aldo Tech Indonesia">
                    </div>

                    <div class="form-group-cust">
                        <label class="form-label-cust">Buat Kata Sandi (Password) <span style="color:red;">*</span></label>
                        <input type="password" name="password" class="form-input-cust" placeholder="Minimal 6 karakter" required>
                    </div>

                    <button type="submit" class="btn-auth-submit" style="background:#16a34a;">📝 Daftar Akun Sekarang</button>
                </form>
            </div>
        </div>
    </section>

    <script>
    function switchAuthTab(tab) {
        if (tab === 'login') {
            document.getElementById('formLogin').style.display = 'block';
            document.getElementById('formRegister').style.display = 'none';
            document.getElementById('tabBtnLogin').classList.add('active');
            document.getElementById('tabBtnRegister').classList.remove('active');
        } else {
            document.getElementById('formLogin').style.display = 'none';
            document.getElementById('formRegister').style.display = 'block';
            document.getElementById('tabBtnRegister').classList.add('active');
            document.getElementById('tabBtnLogin').classList.remove('active');
        }
    }
    </script>
</body>
</html>
{{ end }}
